<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario final · Escape room · Operación Guadix</title>
<style>
  :root { --fondo: #1b1030; --panel: #2a1747; --crema: #f4e9d2; --oro: #e9b949; --rojo: #d6403a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: radial-gradient(120% 120% at 50% 0%, #3a2160 0%, var(--fondo) 70%); color: var(--crema); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 3px solid var(--oro); }
  h1 { margin: 0; font-size: clamp(16px, 2.6vw, 22px); line-height: 1.2; letter-spacing: .02em; }
  h1 span { display: inline-block; background: var(--rojo); color: #fff; font-size: .8em; font-weight: 800; padding: 3px 9px; margin-right: 8px; border-radius: 4px; transform: rotate(-2deg); text-transform: uppercase; }
  a.fuera { color: var(--oro); font-weight: 600; font-size: 15px; text-decoration: none; padding: 8px 4px; }
  a.fuera:hover, a.fuera:focus-visible { text-decoration: underline; outline: none; }
  main { flex: 1; min-height: 0; padding: 12px; }
  iframe { display: block; width: 100%; height: 100%; min-height: 480px; border: 0; border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1><span>Misión 4</span>🕵️ Cuestionario final: Escape room</h1>
  <a class="fuera" id="fuera" target="_blank" rel="noopener">¿No se ve el formulario? Ábrelo en otra pestaña ↗</a>
</header>
<main>
  <iframe id="marco" title="Cuestionario final: Escape room" allow="fullscreen"></iframe>
</main>
<script>
  var FORMS = 'https://docs.google.com/forms/d/e/1FAIpQLSdGlP6vLIlIo9ksY_Ndi7CiiYyvoDczJsGxzLVykl7Bb342mg/viewform';
  document.getElementById('marco').src = FORMS + '?embedded=true';
  document.getElementById('fuera').href = FORMS;
</script>
</body>
</html>
