<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Música de la misión</title>
<style>
  html, body { margin: 0; height: 100%; background: #16120d; font-family: system-ui, sans-serif; color: #fff; }
  .player { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 14px; padding: 8px 16px; }
  #play { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; background: #c7281f; color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  #play:focus-visible, #vol:focus-visible, #bar:focus-visible { outline: 3px solid #f7d23e; outline-offset: 3px; }
  #play svg { width: 24px; height: 24px; fill: #fff; }
  #play .pausa { display: none; }
  #play[aria-pressed="true"] .pausa { display: block; }
  #play[aria-pressed="true"] .tocar { display: none; }
  .info { flex: 1; min-width: 0; }
  .titulo { font-weight: 800; font-size: 17px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .autor { font-size: 12px; color: rgba(255,255,255,.7); margin-bottom: 6px; }
  #bar { width: 100%; accent-color: #c7281f; margin: 0; }
  .vol { flex: none; display: flex; align-items: center; gap: 6px; font-size: 20px; }
  #vol { width: 80px; accent-color: #c7281f; }
  @media (max-width: 420px) { .vol { display: none; } }
</style>
</head>
<body>
<div class="player">
  <button id="play" type="button" aria-label="Poner la música" aria-pressed="false">
    <svg class="tocar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
    <svg class="pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
  </button>
  <div class="info">
    <div class="titulo">Música de la misión</div>
    <div class="autor">Leberch · Far Nights (Spy)</div>
    <input id="bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posición de la música">
  </div>
  <label class="vol"><span aria-hidden="true">🔊</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volumen"></label>
</div>
<audio id="audio" src="leberch-far-nights-spy.mp3" preload="metadata" loop></audio>
<script>
const a = document.getElementById('audio'), play = document.getElementById('play'), bar = document.getElementById('bar'), vol = document.getElementById('vol');
a.volume = Number(vol.value);
function estado() { const on = !a.paused; play.setAttribute('aria-pressed', on); play.setAttribute('aria-label', on ? 'Parar la música' : 'Poner la música'); }
play.addEventListener('click', () => { if (a.paused) a.play().catch(() => {}); else a.pause(); });
a.addEventListener('play', estado); a.addEventListener('pause', estado);
a.addEventListener('timeupdate', () => { if (a.duration) bar.value = (a.currentTime / a.duration) * 100; });
bar.addEventListener('input', () => { if (a.duration) a.currentTime = (bar.value / 100) * a.duration; });
vol.addEventListener('input', () => { a.volume = Number(vol.value); });
</script>
</body>
</html>
